name: Test & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build contracts & cargo test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # Builds every contract for the deploy target. Contract-macro limits
      # (e.g. 32-char function names) are only enforced here, not by
      # `cargo check`/`cargo test`. Also produces the market_token.wasm that
      # tests/router_and_factory_coverage.rs embeds.
      - name: Build contracts (wasm32v1-none, release)
        run: cargo build --workspace --target wasm32v1-none --release

      - name: cargo test
        run: cargo test --workspace
